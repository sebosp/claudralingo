[package]
name = "claudralingo"
authors = ["Seb Ospina <kraige@gmail.com>"]
version = "0.2.1"
edition = "2024"
# The exercises and the tutor logic are ported from Klavaro, GPL-3.0-or-later.
license = "GPL-3.0-or-later"
description = "A touch typing tutor in Bevy, Chinese hanzi calligraphy later"

[dependencies]
# No "bevy/dynamic_linking" here: the release binaries are copied to portia-zt, the `dynamic`
# feature (`cargo dev`) is for the local runs only.
bevy = { version = "0.20.0", default-features = false, features = [
    "ui",
    "bevy_feathers",
    # The words of the hanzi mode, see assets/hanzi.
    "bevy_audio",
    "mp3",
    # Paste a keymap of ZMK, see `crate::ui`; the system clipboard on the desktops below.
    "bevy_clipboard",
] }
fastrand = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = { version = "0.4", features = [
    "max_level_debug",
    "release_max_level_warn",
] }
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
inputx-pinyin = { version = "1.4.0", default-features = false }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["system_clipboard"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
fastrand = { version = "2.3", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }
js-sys = "0.3"

[features]
default = []
# Bevy development helpers, not used in the release builds.
dev = ["bevy/bevy_dev_tools", "bevy/track_location"]
# Bevy as a shared library for fast local builds, `cargo dev`. Not for the copied binaries.
dynamic = ["bevy/dynamic_linking"]

# Small optimization for our code, full optimization for the dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# trunk build --release uses this profile for the browser build, see index.html.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }
