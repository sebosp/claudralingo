# The native builds of the game: Linux, an Android APK and an iOS app for the simulator, kept
# as artifacts of the run, attached to a release for the tags `v*`.
name: Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Bevy's system libraries; .cargo/config.toml links with clang and mold.
      - name: Install the libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev mold clang
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p claudralingo-linux-x86_64
          strip -o claudralingo-linux-x86_64/claudralingo target/release/claudralingo
          cp README.md LICENSE claudralingo-linux-x86_64/
          tar -czf claudralingo-linux-x86_64.tar.gz claudralingo-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: claudralingo-linux-x86_64
          path: claudralingo-linux-x86_64.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang
          cargo install --locked cargo-apk
      # The runner has the Android SDK and an NDK.
      - name: Build the APK
        env:
          # The release key, from the secrets of the repository; never in the repository.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "Signed with the release key"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/release.jks"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          else
            # Without the secrets, a debug key made here: installable, not for a store.
            echo "Signed with a debug key"
            keytool -genkey -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/debug.keystore"
            export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          fi
          cd mobile
          cargo apk build --release --lib
          find target -name "*.apk"
          cp "$(find target -name '*.apk' | head -1)" ../claudralingo-android-arm64.apk
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: claudralingo-android-arm64
          path: claudralingo-android-arm64.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      # For the simulator: an app for a device needs an Apple signing identity.
      - name: Build the app
        run: |
          cd mobile
          xcodebuild -project claudralingo_mobile.xcodeproj -scheme claudralingo_mobile -configuration Release \
            -sdk iphonesimulator -arch arm64 -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          cd build/Build/Products/Release-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/claudralingo-ios-simulator.zip" claudralingo_mobile.app
      - uses: actions/upload-artifact@v4
        with:
          name: claudralingo-ios-simulator
          path: claudralingo-ios-simulator.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            claudralingo-linux-x86_64.tar.gz
            claudralingo-android-arm64.apk
            claudralingo-ios-simulator.zip
